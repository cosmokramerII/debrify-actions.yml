name: Debrify Actions
author: Community
actions:
  - name: Open in Debrify
    version: 3
    minVersion: "0.7"
    about: |
      Tries several possible Debrify deeplink formats.
      Test which one actually launches the app.
    website: https://github.com/varunsalian/debrify
    tags:
      - name: Magnet
        color: "#FF9500"
    requires:
      - magnet
    deeplink:
      - os: iOS
        scheme: "{link}"                          # same as iTorrent (most correct)
      - os: iOS
        scheme: "debrify://{link}"
      - os: iOS
        scheme: "debrify://add?url={link}"
      - os: iOS
        scheme: "debrify://magnet?url={link}"
      - os: iOS
        scheme: "debrify://?magnet={link}"
